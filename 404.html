<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found – Thread and Blooms</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #8b6f47;
            --gold-dark: #6d5536;
            --cream: #faf8f5;
            --text-dark: #2c2c2c;
            --text-light: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .wrap {
            max-width: 480px;
        }

        .yarn {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2.6rem;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        a.home-btn {
            display: inline-block;
            padding: 1rem 2.2rem;
            border-radius: 40px;
            background: var(--gold);
            color: white;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        a.home-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="yarn">🧶</div>
        <h1>Page Not Found</h1>
        <p>This thread got a little tangled — the page you're looking for doesn't exist. Let's get you back to the bouquets.</p>
        <a class="home-btn" href="/">Back to Thread and Blooms</a>
    </div>
</body>
</html>
